name: Build LOADOUT firmware

# Compila el firmware de la Tab5 y publica una Release con:
#   - loadout-tab5.bin          (imagen de app para OTA, offset 0x20000)
#   - loadout-tab5-factory.bin  (imagen completa @ 0x0 para flasheo desde cero / web flasher)
#   - latest.json               (manifest OTA que lee el dispositivo)
# Dispara al hacer push de un tag vX.Y.Z (ej. git tag v1.1.0 && git push --tags).
# Tambien se puede lanzar a mano (workflow_dispatch) para una build de prueba.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # para crear la Release

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build firmware
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          . "$IDF_PATH/export.sh"

          # Dependencias externas (LVGL/mooncake/smooth_ui_toolkit) -> dependencies/.
          # No se versionan en el repo; las clona este script (las usa
          # EXTRA_COMPONENT_DIRS=../../dependencies del proyecto tab5).
          python "$GITHUB_WORKSPACE/fetch_repos.py"

          # Version: del tag (v1.2.0 -> 1.2.0) o 0.0.0-dev en pruebas manuales.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="0.0.0-dev"
          fi
          echo "VER=$VER" >> "$GITHUB_ENV"
          printf '#pragma once\n#define LOADOUT_VERSION "%s"\n' "$VER" \
            > platforms/tab5/main/loadout_version.h

          cd platforms/tab5
          set -o pipefail
          idf.py build 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          # App image (OTA, se escribe en la ranura libre) + imagen factory fusionada
          # (bootloader + tabla de particiones + ota_data + app) para flasheo a 0x0.
          # @flash_args lleva los offsets/flags exactos que genera idf.py (no hardcode).
          cp build/m5stack_tab5.bin "$GITHUB_WORKSPACE/loadout-tab5.bin"
          ( cd build && esptool.py --chip esp32p4 merge_bin -o "$GITHUB_WORKSPACE/loadout-tab5-factory.bin" @flash_args )

          cat > ../../latest.json <<EOF
          {
            "version": "$VER",
            "url": "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/loadout-tab5.bin",
            "notes": "LOADOUT $VER"
          }
          EOF

      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          # Publica los errores como anotaciones (legibles desde la API).
          f="$GITHUB_WORKSPACE/build.log"
          [ -f "$f" ] || exit 0
          enc() { python3 -c 'import sys;print(sys.stdin.read().replace("%","%25").replace("\r","").replace("\n","%0A"))'; }
          echo "::error title=build errors::$(grep -nE 'error|Error|ERROR|failed|FAILED|undefined reference|No version|Cannot|conflict' "$f" | grep -v -- '-Werror' | head -60 | enc)"
          echo "::warning title=build log tail::$(tail -n 80 "$f" | enc)"

      - name: Push build outputs to 'builds' branch
        shell: bash
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          mkdir -p /tmp/out && cp loadout-tab5.bin loadout-tab5-factory.bin latest.json /tmp/out/
          cp platforms/tab5/build/m5stack_tab5.elf /tmp/out/ 2>/dev/null || true
          cp platforms/tab5/build/flash_args platforms/tab5/build/partition_table/partition-table.bin /tmp/out/ 2>/dev/null || true
          cp platforms/tab5/dependencies.lock /tmp/out/ 2>/dev/null || true
          cd /tmp/out
          git init -q -b builds && git config user.name ci && git config user.email ci@localhost
          git add -A && git commit -qm "build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" builds

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: loadout-${{ env.VER }}
          path: |
            loadout-tab5.bin
            loadout-tab5-factory.bin
            latest.json

      - name: Publish Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: LOADOUT ${{ env.VER }}
          tag_name: ${{ github.ref_name }}
          files: |
            loadout-tab5.bin
            loadout-tab5-factory.bin
            latest.json
